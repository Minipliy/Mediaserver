<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mediaserver</title>
<link rel="icon" href="/web/icon.png">
<link rel="apple-touch-icon" href="/web/icon.png">
<link rel="stylesheet" href="/web/app.css">
<script src="/web/app.js" defer></script>
</head>
<body>
<a class="skip" href="#inhalt">Zum Inhalt springen</a>

<section id="anmelden" class="login" hidden>
  <form id="anmeldeformular" class="login-card">
    <img src="/web/icon.png" width="76" height="76" alt="">
    <h1>Deine Medien.<br>Überall dabei.</h1>
    <p>Melde dich mit dem Zugangs-Token an, das du auch in der App verwendest.</p>
    <input type="text" name="username" autocomplete="username" value="Mediaserver" hidden>
    <div class="field">
      <label for="token">API-Token</label>
      <input id="token" name="password" type="password" autocomplete="current-password" required spellcheck="false" placeholder="Token eingeben">
    </div>
    <label class="check"><input id="merken" type="checkbox" checked> Auf diesem Gerät angemeldet bleiben</label>
    <button type="submit" class="primary wide">Verbinden</button>
    <p id="anmeldefehler" class="error" role="alert"></p>
  </form>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      <input id="suche" type="search" placeholder="Suchen" aria-label="In der ganzen Bibliothek suchen">
    </div>
  </header>
  <main id="inhalt" tabindex="-1"></main>

  <div id="player" class="mini" hidden>
    <button id="mini-oeffnen" class="mini-main" type="button" aria-label="Großen Player öffnen">
      <img id="player-cover" class="cover mini-cover" alt="">
      <span class="mini-text"><strong id="player-titel"></strong><span id="player-kuenstler"></span></span>
    </button>
    <button id="zurueck" class="icon-button" type="button" aria-label="Vorheriger Titel"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M11 6v12L3 12zM21 6v12l-8-6z"/></svg></button>
    <button id="abspielen" class="play-circle" type="button" aria-label="Abspielen"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill play-shape" d="M8 5v14l11-7z"/><path class="fill pause-shape" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
    <button id="weiter" class="icon-button" type="button" aria-label="Nächster Titel"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M13 6v12l8-6zM3 6v12l8-6z"/></svg></button>
    <span class="mini-progress"><span id="mini-fortschritt"></span></span>
  </div>

  <nav class="tabbar" aria-label="Bereiche">
    <a href="#start" data-section="start"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M12 3 2.5 11h2.5v9h5.5v-6h3v6H19v-9h2.5z"/></svg><span>Start</span></a>
    <a href="#musik/alben" data-section="musik"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M9 4v11.3A3.5 3.5 0 1 0 11 18.5V8.5l8-1.8v7.1a3.5 3.5 0 1 0 2 3.2V2.5z"/></svg><span>Musik</span></a>
    <a href="#videos/filme" data-section="videos"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path class="fill" d="M10 9v6l5-3z"/></svg><span>Videos</span></a>
    <a href="#einstellungen" data-section="einstellungen"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2 5.5 5.5"/></svg><span>Einstellungen</span></a>
  </nav>
</div>

<div id="jetzt" class="now-playing" hidden role="dialog" aria-modal="true" aria-label="Wiedergabe">
  <div id="jetzt-hintergrund" class="now-backdrop" aria-hidden="true"></div>
  <div class="now-inner">
    <button id="jetzt-schliessen" class="grabber" type="button" aria-label="Großen Player schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7"/></svg></button>
    <div class="now-stage">
      <img id="jetzt-cover" class="now-cover" alt="">
      <div id="jetzt-text" class="lyrics" hidden aria-live="off"></div>
    </div>
    <div class="now-title-row">
      <div class="now-text"><strong id="jetzt-titel" title="Zum Album"></strong><span id="jetzt-kuenstler"></span></div>
      <button id="jetzt-herz" class="icon-button heart" type="button" aria-label="Zu Lieblingssongs hinzufügen" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-9.2-9.4C1.6 7.2 3.8 4 7.2 4c2 0 3.6 1.1 4.8 2.8C13.2 5.1 14.8 4 16.8 4c3.4 0 5.6 3.2 4.4 6.6C19.5 15.4 12 20 12 20z"/></svg></button>
    </div>
    <div class="now-seek">
      <input id="position" type="range" min="0" max="0" step="0.1" value="0" aria-label="Position im Titel">
      <div class="now-times"><span id="zeit">0:00</span><span id="dauer">0:00</span></div>
    </div>
    <div class="now-controls">
      <button id="jetzt-zufall" class="icon-button small" type="button" aria-label="Zufallswiedergabe" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3.5c4 0 6 10 10 10H21M3 17h3.5c1.6 0 2.8-1.6 3.9-3.6M14.1 9.6C15 8 16 7 17.5 7H21M18 4l3 3-3 3M18 14l3 3-3 3"/></svg></button>
      <button id="jetzt-zurueck" class="icon-button big" type="button" aria-label="Vorheriger Titel"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M11 6v12L3 12zM21 6v12l-8-6z"/></svg></button>
      <button id="jetzt-abspielen" class="play-circle big" type="button" aria-label="Abspielen"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill play-shape" d="M8 5v14l11-7z"/><path class="fill pause-shape" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
      <button id="jetzt-weiter" class="icon-button big" type="button" aria-label="Nächster Titel"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M13 6v12l8-6zM3 6v12l8-6z"/></svg></button>
      <button id="jetzt-wiederholen" class="icon-button small" type="button" aria-label="Wiederholen: aus" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11V9a3 3 0 0 1 3-3h12M16 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H5M8 21l-3-3 3-3"/></svg></button>
    </div>
    <div class="now-volume">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M4 9h4l5-4v14l-5-4H4z"/></svg>
      <input id="lautstaerke" type="range" min="0" max="1" step="0.01" value="1" aria-label="Lautstärke">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>
    </div>
    <div class="now-bottom">
      <button id="jetzt-songtext" class="icon-button small" type="button" aria-label="Songtext" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg></button>
      <button id="jetzt-timer" class="icon-button small" type="button" aria-label="Schlaf-Timer" aria-pressed="false" aria-haspopup="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
      <button id="jetzt-mehr" class="icon-button small" type="button" aria-label="Aktionen für diesen Titel" aria-haspopup="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="fill" cx="5.5" cy="12" r="1.6"/><circle class="fill" cx="12" cy="12" r="1.6"/><circle class="fill" cx="18.5" cy="12" r="1.6"/></svg></button>
      <button id="jetzt-liste" class="icon-button small" type="button" aria-label="Als Nächstes" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h12M4 12h12M4 18h8M19 15v6M16 18h6"/></svg></button>
    </div>
    <ol id="jetzt-warteschlange" class="queue" hidden aria-label="Als Nächstes"></ol>
  </div>
  <audio id="audio" preload="auto"></audio>
</div>

<div id="video-ebene" class="video-layer" hidden role="dialog" aria-modal="true" aria-labelledby="video-titel">
  <div class="video-bar">
    <button id="video-schliessen" type="button" class="pill">Fertig</button>
    <strong id="video-titel"></strong>
    <button id="intro" type="button" class="pill" hidden>Intro überspringen</button>
    <button id="naechste-folge" type="button" class="pill" hidden>Nächste Folge</button>
  </div>
  <video id="video" controls playsinline></video>
</div>
</body>
</html>
